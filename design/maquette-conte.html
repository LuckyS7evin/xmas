<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Conte illustré</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Nunito+Sans:wght@400;600;700&display=swap">
<style>
body{margin:0}
a{color:#C4492A}a:hover{color:#9C3720}
@keyframes snow{from{transform:translateY(-20px)}to{transform:translateY(860px)}}
@keyframes spin{to{transform:translateX(-360px)}}
@keyframes fly{0%{offset-distance:0%;opacity:0}10%,85%{opacity:1}100%{offset-distance:100%;opacity:0}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-5px) rotate(2deg)}}
@keyframes tw{0%,100%{transform:scale(.7);opacity:.5}50%{transform:scale(1.1);opacity:1}}
@keyframes rise{0%{transform:translateY(0) scale(.6);opacity:0}30%{opacity:.8}100%{transform:translateY(-22px) scale(1.3);opacity:0}}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
@keyframes wig{0%,90%,100%{transform:rotate(0)}93%{transform:rotate(-12deg)}97%{transform:rotate(10deg)}}
.f{position:absolute;top:0;border-radius:50%;background:#FFFFFF;animation:snow linear infinite}
.land{animation:spin 30s linear infinite}
.sl{offset-path:path('M -40 230 Q 195 10 430 190');offset-rotate:auto;animation:fly 10s ease-in-out infinite}
.bob{animation:bob 1.4s ease-in-out infinite}
.tw{transform-box:fill-box;transform-origin:center;animation:tw 2.6s ease-in-out infinite}
.sm{animation:rise 2.4s ease-out infinite}
.up{animation:up .8s cubic-bezier(.2,.8,.2,1) both}
.wig{display:inline-flex;animation:wig 4s ease-in-out infinite}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FBE6D2; color: #3A2630; font-family: 'Nunito Sans', sans-serif; display: flex; flex-direction: column; overflow: hidden; position: relative">

    <span class="f" style="left: 22%; width: 4px; height: 4px; animation-duration: 12s; animation-delay: -4s"></span>
    <span class="f" style="left: 41%; width: 7px; height: 7px; animation-duration: 10s; animation-delay: -7s"></span>

    <span class="f" style="left: 78%; width: 8px; height: 8px; animation-duration: 13s; animation-delay: -9s"></span>
    <span class="f" style="left: 91%; width: 4px; height: 4px; animation-duration: 8s; animation-delay: -5s"></span>

  </div>
  <div class="up" style="text-align: center; padding: 28px 24px 0">

    <div style="font-family: Fraunces, serif; font-size: 34px; line-height: 1.1; margin-top: 8px">Le Père Noël vole<br><span style="font-style: italic; color: {{accent}}">au-dessus de la Laponie</span></div>
  </div>
  <div style="position: relative; height: 300px; margin-top: 8px">

      <circle cx="195" cy="160" r="134" fill="#F6CFB4"/>
      <circle cx="195" cy="160" r="120" fill="#2F3F7A"/>

          <path d="M80 110c25-18 60-10 70 10s-10 35 10 50 20 40-10 45-40-20-55-35-40-50-15-70z"/>

    </svg>
    <div class="sl" style="position: absolute; left: 0; top: 0; width: 110px; height: 44px">
      <div class="bob">
        <svg width="110" height="44" viewBox="0 0 110 44" aria-hidden="true">
          <path d="M-40 30C-24 26-10 30 2 28" stroke="#EBA93A" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-dasharray="1 6"/>
          <g fill="#A66B42" stroke="#3A2630" stroke-width="1.2"><ellipse cx="88" cy="20" rx="11" ry="5.5"/><circle cx="100" cy="14" r="4"/></g>
          <path d="M82 25l-3 8M86 25l1 8M92 25l-2 8M96 25l2 8M100 10l-2-6M100 10l3-6" stroke="#3A2630" stroke-width="1.4" fill="none" stroke-linecap="round"/>
          <circle cx="104.5" cy="14" r="2" fill="#E2412B"/>
          <path d="M42 22L77 19" stroke="#3A2630" stroke-width="1"/>
          <path d="M8 18h34c4 0 6 3 6 7v4H12c-4 0-6-4-4-11z" fill="{{accent}}" stroke="#3A2630" stroke-width="1.4"/>
          <path d="M4 36h44c4 0 6-3 6-5" stroke="#3A2630" stroke-width="2" fill="none" stroke-linecap="round"/>
          <path d="M20 18c0-6 3-9 7-9s7 3 7 9z" fill="#E2412B" stroke="#3A2630" stroke-width="1.2"/>
          <circle cx="28" cy="8" r="4" fill="#F7D6BE" stroke="#3A2630" stroke-width="1"/>
          <path d="M24 9c0 4 2 6 4 6s4-2 4-6z" fill="#FFFFFF" stroke="#3A2630" stroke-width="0.8"/>
          <path d="M23 6c1-5 5-6 9-3l3 4h-3z" fill="#E2412B" stroke="#3A2630" stroke-width="1"/><circle cx="35" cy="7" r="1.8" fill="#FFFFFF"/>

        </svg>
      </div>
    </div>
  </div>
  <div class="up" style="display: flex; justify-content: center; gap: 24px; padding-top: 6px; text-align: center; animation-delay: .2s">
    <div><div style="font-family: Fraunces, serif; font-size: 26px; font-weight: 600">842 M</div><div style="font-size: 12px; color: #6E5258">cadeaux déposés</div></div>
    <div style="width: 1px; background: #E8C3A8"></div>
    <div><div style="font-family: Fraunces, serif; font-size: 26px; font-weight: 600">9</div><div style="font-size: 12px; color: #6E5258">rennes en forme</div></div>
    <div style="width: 1px; background: #E8C3A8"></div>
    <div><div style="font-family: Fraunces, serif; font-size: 26px; font-weight: 600">38 %</div><div style="font-size: 12px; color: #6E5258">du voyage</div></div>
  </div>
  <div class="up" style="margin: 20px 20px 0; padding: 16px 18px; background: #FFF7EE; border: 2px solid #3A2630; border-radius: 22px; box-shadow: 5px 5px 0 #3A2630; display: flex; gap: 14px; align-items: center; animation-delay: .4s">
    <svg width="60" height="64" viewBox="0 0 60 64" aria-hidden="true" style="flex-shrink: 0">
      <circle class="sm" cx="42" cy="14" r="4" fill="#E8C3A8" style="animation-delay: 0s"/>
      <circle class="sm" cx="44" cy="12" r="3" fill="#E8C3A8" style="animation-delay: .8s"/>
      <circle class="sm" cx="41" cy="13" r="3.5" fill="#E8C3A8" style="animation-delay: 1.6s"/>
      <rect x="38" y="18" width="8" height="14" fill="#C4492A" stroke="#3A2630" stroke-width="1.5"/>
      <path d="M6 34L30 14l24 20" fill="#3A2630" stroke="#3A2630" stroke-width="2" stroke-linejoin="round"/>
      <rect x="11" y="33" width="38" height="27" rx="2" fill="#EBA93A" stroke="#3A2630" stroke-width="1.8"/>

      <rect class="tw" x="15" y="39" width="7" height="7" fill="#FFF1C9" stroke="#3A2630" stroke-width="1"/>
    </svg>
    <div>
      <div style="font-size: 13px; color: #6E5258">La maison de Léa &amp; Tom</div>
      <div style="font-family: Fraunces, serif; font-size: 22px; line-height: 1.2">Il arrive vers <span style="font-style: italic; color: {{accent}}">23 h 40</span></div>
      <div style="font-size: 13px; font-weight: 700; margin-top: 2px; color: #7A4A1E">Chut… il faut dormir !</div>
    </div>
  </div>
  <div class="up" style="margin-top: auto; padding: 0 20px 28px; display: flex; gap: 10px; animation-delay: .6s">
    <a href="#" style="flex: 1; min-height: 54px; border-radius: 27px; background: {{accent}}; color: #FFF7EE; font-weight: 700; font-size: 15px; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; border: 2px solid #3A2630; box-shadow: 3px 3px 0 #3A2630">
      <span class="wig"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 20l4-1L19 8l-3-3L5 16zM14 7l3 3"/></svg></span>Écrire au Père Noël
    </a>

</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#C4492A","options":["#C4492A","#B8406E","#2F7A6B"]},"$preview":{"width":390,"height":844}}'>
